<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEO Publisher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img class="brand-logo" src="logo.png" alt="" />
      <strong>GEO Publisher</strong>
      <span id="connection" class="status-badge" data-state="ready" aria-live="polite">桌面端已启动</span>
      <span id="version" class="header-meta"></span>
    </header>
    <aside>
      <p class="section-title">发布平台</p>
      <button data-platform="baijia"><span>百家号</span><span class="platform-state">打开</span></button>
      <button data-platform="toutiao"><span>头条号</span><span class="platform-state">打开</span></button>
      <button data-platform="zhihu"><span>知乎</span><span class="platform-state">打开</span></button>
      <button data-platform="penguin"><span>企鹅号</span><span class="platform-state">打开</span></button>
      <button data-platform="sohu"><span>搜狐号</span><span class="platform-state">打开</span></button>
      <button data-platform="netease"><span>网易号</span><span class="platform-state">打开</span></button>

      <p class="section-title integration-title">连接</p>
      <button id="connect-workbuddy" class="command-button"><span>连接 WorkBuddy</span><span id="workbuddy-state">未准备</span></button>
      <button id="check-update" class="command-button"><span>检查更新</span><span id="update-state">检查</span></button>
      <button id="install-update" class="primary-command" hidden>重启并安装更新</button>
      <button id="beta-access" class="command-button"><span>获取 Beta 灰度版</span><span>邀请码</span></button>
      <button id="beta-disable" class="command-button" hidden><span>恢复正式版</span><span>stable</span></button>
      <label class="setting-toggle"><input id="launch-at-login" type="checkbox" /><span>开机自动启动</span></label>
    </aside>
    <dialog id="beta-dialog">
      <form method="dialog" class="beta-form">
        <h2>获取 Beta 灰度版</h2>
        <p>输入收到的灰度邀请码，应用会切换到 Beta 更新通道。</p>
        <label for="beta-code">邀请码</label>
        <input id="beta-code" autocomplete="off" placeholder="BETA-XXXXXX" />
        <div class="beta-actions"><button value="cancel">取消</button><button id="beta-submit" class="primary-command" value="default">检查 Beta 更新</button></div>
      </form>
    </dialog>
    <main id="empty">
      <div class="setup">
        <h1>开始使用</h1>
        <div class="setup-row"><span class="step-number">1</span><div><strong>登录发布平台</strong><p>从左侧逐个平台打开并登录。</p></div></div>
        <div class="setup-row"><span class="step-number">2</span><div><strong>连接 WorkBuddy</strong><p>点击后前往 WorkBuddy 粘贴已复制的连接指令。</p></div></div>
        <div class="setup-row"><span class="step-number">3</span><div><strong>开始发布</strong><p>直接在 WorkBuddy 中说明文章和目标平台。</p></div></div>
        <p id="action-message" class="action-message" aria-live="polite">桌面端已就绪</p>
      </div>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
