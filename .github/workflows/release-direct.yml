name: Release Desktop Direct

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
  TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
  TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
  TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
  TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
  GEO_UPDATE_PUBLIC_BASE: ${{ vars.TENCENT_COS_BASE_URL }}/geo-publisher/releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - shell: bash
        run: npm run build:cli
      - run: node scripts/prepare-release-output.mjs release/win-x64
      - run: npx electron-builder --win --x64 --publish never --config.directories.output=release/win-x64
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: node scripts/upload-release.mjs release/win-x64 win-x64 stable

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      - name: Build and notarize Apple Silicon package
        run: |
          node scripts/prepare-release-output.mjs release/mac-arm64
          npx electron-builder --mac --arm64 --publish never --config.directories.output=release/mac-arm64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: node scripts/upload-release.mjs release/mac-arm64 mac-arm64 stable
