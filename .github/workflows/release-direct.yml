name: Release Desktop Direct

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道'
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: read

env:
  TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
  TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
  TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
  TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
  TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
  GEO_UPDATE_PUBLIC_BASE: ${{ vars.TENCENT_COS_BASE_URL }}/geo-publisher/releases

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm version matches selected channel
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          node -e "const version=require('./package.json').version; const prerelease=/-[0-9A-Za-z.]+$/.test(version); const beta=/-beta\./.test(version); const channel=process.env.RELEASE_CHANNEL; if ((channel === 'beta' && !beta) || (channel === 'stable' && prerelease)) { throw new Error('版本 ' + version + ' 不能发布到 ' + channel + ' 通道'); }"

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - shell: bash
        run: npm run build:cli
      - run: node scripts/prepare-release-output.mjs release/win-x64
      - run: npx electron-builder --win --x64 --publish never --config.directories.output=release/win-x64
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: node scripts/upload-release.mjs release/win-x64 win-x64 "${{ inputs.channel }}"

  mac:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      - name: Build and notarize Apple Silicon package
        run: |
          node scripts/prepare-release-output.mjs release/mac-arm64
          npx electron-builder --mac --arm64 --publish never --config.directories.output=release/mac-arm64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: node scripts/upload-release.mjs release/mac-arm64 mac-arm64 "${{ inputs.channel }}"
