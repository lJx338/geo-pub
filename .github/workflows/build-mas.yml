name: Build Mac App Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '留空使用 build/store-version.json，与 Windows 商店包版本保持一致'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  mas:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      MAS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      MAS_PROFILE_PATH: /tmp/lingxi-mas.provisionprofile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve store version
        env:
          STORE_VERSION_OVERRIDE: ${{ inputs.version }}
        run: node scripts/store-version.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Validate signing inputs
        env:
          MAS_CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          MAS_CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          MAS_CSC_INSTALLER_LINK: ${{ secrets.MAS_CSC_INSTALLER_LINK }}
          MAS_CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_CSC_INSTALLER_KEY_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: python3 scripts/prepare-mas-profile.py
      - run: npm ci
      - run: npm run typecheck
      - run: go test ./...
        working-directory: cli
      - run: npm run build
      - run: npm run build:cli
      - run: npm test
      - name: Build signed store package
        run: npm run package:mas
        env:
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_CSC_INSTALLER_KEY_PASSWORD }}
      - name: Verify package and embedded helper
        run: python3 scripts/verify-mas-package.py
      - name: Validate package with App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID repository secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD repository secret}"
          packages=(release/store/mas-*/*.pkg)
          test "${#packages[@]}" -eq 1
          xcrun altool --validate-app --file "${packages[0]}" --type macos \
            --username "$APPLE_ID" --password '@env:APPLE_APP_SPECIFIC_PASSWORD' --output-format json
      - uses: actions/upload-artifact@v4
        with:
          name: Lingxi-Workspace-MAS-${{ env.MAS_APP_VERSION }}-${{ github.run_number }}
          path: release/store/mas-*/*.pkg
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary profile
        if: always()
        run: python3 -c 'import os; from pathlib import Path; Path(os.environ["MAS_PROFILE_PATH"]).unlink(missing_ok=True)'
