name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - name: Test Mach-O signing classification
        run: python3 -B -m unittest discover -s scripts -p 'test_mas_*.py'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cd cli && go test ./...
      - run: npm run build:cli

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run build
      - shell: bash
        run: npm run build:cli
      - name: Verify Store paths and ordinary installer compatibility
        run: npx vitest run src/main/windows-store-paths.test.ts src/main/workbuddy-store.test.ts src/main/workbuddy-integration.test.ts src/main/cli-installer.test.ts src/main/material-storage.test.ts src/main/material-diagnostics.test.ts src/main/content-store.test.ts
      - name: Verify material diagnostic export from the desktop UI
        run: node tests/material-diagnostics-smoke.mjs
      - name: Verify Zhihu publish interactions without contacting the platform
        run: npm run test:zhihu-publish
      - run: node scripts/prepare-release-output.mjs release/win-smoke
      - run: npx electron-builder --config scripts/windows-config.mjs --win --x64 --publish never --config.directories.output=release/win-smoke
      - shell: pwsh
        run: ./tests/windows-install-smoke.ps1 -ReleaseDirectory release/win-smoke
      - run: node tests/launch-at-login-smoke.mjs
      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: Lingxi-Workspace-Windows-EXE-${{ github.run_number }}
          path: release/win-smoke/*.exe
          if-no-files-found: error
          retention-days: 14
