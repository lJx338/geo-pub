name: Probe install-time APPX shortcuts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lingxi-workspace-msix-1.0.24
          run-id: 44469686524
          github-token: ${{ github.token }}
          path: probe-input
      - name: Inspect actual desktop items immediately after APPX deployment
        shell: pwsh
        run: ./tests/probe-appx-install-shortcut.ps1
      - name: Preserve installed shortcut evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appx-install-shortcut-evidence
          path: probe-evidence
