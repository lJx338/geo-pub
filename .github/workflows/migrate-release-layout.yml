name: Migrate Release Storage Layout

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable version to migrate
        required: true
        default: 0.2.0
        type: string

permissions:
  contents: read

env:
  TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
  TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
  TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
  TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
  TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install coscmd
      - name: Copy stable artifacts and publish compatibility pointers
        run: sh scripts/migrate-release-layout.sh "${{ inputs.version }}"
      - name: Verify public update manifests
        run: |
          base="https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/${TENCENT_COS_PREFIX:-geo-publisher}/releases"
          for manifest in \
            channels/stable/win-x64/latest.yml \
            channels/stable/win-x64/stable.yml \
            channels/stable/mac-arm64/latest-mac.yml \
            channels/stable/mac-arm64/stable-mac.yml \
            stable/win-x64/latest.yml \
            stable/win-x64/stable.yml \
            stable/mac-arm64/latest-mac.yml \
            stable/mac-arm64/stable-mac.yml \
            beta/win-x64/beta.yml \
            beta/mac-arm64/beta-mac.yml; do
            value=$(curl -fsSL --retry 5 "$base/$manifest" | sed -n 's/^version: //p' | head -1)
            test "$value" = "${{ inputs.version }}" || {
              echo "$manifest returned version $value" >&2
              exit 1
            }
          done
