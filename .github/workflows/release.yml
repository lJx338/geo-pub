name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]
      upload_to_cos:
        description: Upload artifacts and update manifests in COS
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
  TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
  TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
  TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
  TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - shell: bash
        run: npm run build:cli
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Select channel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CHANNEL=${{ inputs.channel }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
          fi
      - run: node scripts/prepare-release-output.mjs release/win-x64
      - run: npx electron-builder --win --x64 --publish never --config.directories.output=release/win-x64
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - shell: bash
        if: github.event_name != 'workflow_dispatch' || inputs.upload_to_cos
        run: node scripts/upload-release.mjs release/win-x64 win-x64 "$CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: geo-publisher-windows
          path: |
            release/win-x64/*.exe
            release/win-x64/*.yml
            release/win-x64/*.blockmap

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Select channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CHANNEL=${{ inputs.channel }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
          fi
      - name: Build and notarize Apple Silicon package
        run: |
          node scripts/prepare-release-output.mjs release/mac-arm64
          npx electron-builder --mac --arm64 --publish never --config.directories.output=release/mac-arm64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS artifacts and update manifest
        if: github.event_name != 'workflow_dispatch' || inputs.upload_to_cos
        run: node scripts/upload-release.mjs release/mac-arm64 mac-arm64 "$CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: geo-publisher-macos-arm64
          path: |
            release/mac-arm64/*.dmg
            release/mac-arm64/*.zip
            release/mac-arm64/*.yml
            release/mac-arm64/*.blockmap
