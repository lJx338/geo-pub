name: Upload Notarized Mac Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag containing the notarized assets
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: read

env:
  TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
  TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
  TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
  TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
  TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download notarized Apple Silicon assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/mac-arm64
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release/mac-arm64 \
            --pattern '*mac-arm64*' \
            --pattern 'beta-mac.yml' \
            --pattern 'latest-mac.yml'
      - run: python -m pip install coscmd
      - name: Upload artifacts, then publish manifest
        run: sh scripts/upload-release.sh release/mac-arm64 mac-arm64 "${{ inputs.channel }}"
